name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TokenTrackerGateway-Windows-x64.exe
            run_cmd: pyinstaller --noconsole --onefile --name "TokenTrackerGateway" main.py
            output_path: dist/TokenTrackerGateway.exe
          - os: macos-latest
            artifact_name: TokenTrackerGateway-macOS.zip
            run_cmd: |
              pyinstaller --noconsole --onedir --windowed --name "TokenTrackerGateway" main.py
              cd dist && zip -r TokenTrackerGateway-macOS.zip TokenTrackerGateway.app
            output_path: dist/TokenTrackerGateway-macOS.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application
        run: ${{ matrix.run_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
